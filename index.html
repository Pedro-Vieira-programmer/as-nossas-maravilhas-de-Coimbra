<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="As Nossas Maravilhas de Coimbra">
    <meta name="theme-color" content="#ffffff">
    <title>As Nossas Maravilhas de Coimbra</title>
    <link rel="stylesheet" href="components.css">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="icon.png">
</head>
<body>
    <main class="screen1-container">
        <!-- Hexagon decoration (top-left) -->
        <div class="screen1-hexagon-shape">
            <img src="./Screens/screen1/polygon.png" alt="Decoração hexagonal" class="screen1-hexagon-img">
        </div>

        <!-- Map of Coimbra (top-right) -->
        <div class="screen1-map-wrapper">
            <img src="./Screens/screen1/image1.png" alt="Mapa de Coimbra" class="screen1-map-img">
        </div>

        <!-- Main title text -->
        <div class="screen1-title-wrapper">
            <h1 class="screen1-title-text">AS NOSSAS<br>MARAVI-<br>LHAS<br>DE<br>COIMBRA</h1>
        </div>

        <!-- University/Church illustration -->
        <div class="screen1-university-wrapper">
            <img src="./Screens/screen1/university.png" alt="Universidade de Coimbra" class="screen1-university-img">
        </div>

        <!-- Bottom gray rectangle -->
        <div class="screen1-gray-section">
            <img src="./Screens/screen1/rectange.png" alt="Seção inferior" class="screen1-gray-bg">
            
            <!-- Start button -->
            <a href="screen2.html">
                <button class="screen1-iniciar-btn" onclick="handleStartClick()">
                    <span class="screen1-btn-text">Iniciar</span>
                    <span class="screen1-btn-arrow">↑</span>
                </button>
            </a>
        </div>
    </main>

    <script>
        function handleStartClick() {
            console.log('Iniciar clicado');
        }
    </script>
</body>
</html>
