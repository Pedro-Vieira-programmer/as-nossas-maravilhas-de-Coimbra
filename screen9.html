<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guia - As nossas maravilhas de Coimbra</title>
    <link rel="stylesheet" href="components.css">
    <link rel="stylesheet" href="directions.css">
    <link rel="icon" type="image/png" href="icon.png">
</head>
<body>
    <div class="route-container">
        <!-- Header with image -->
        <header class="app-header app-header--with-image">
            <img src="Screens/screen9/Guia.png" alt="Guia" class="app-header__title-image">
        </header>

        <!-- Main Content -->
        <main class="app-content app-content--scrollable">
            <!-- Directions Title -->
            <div class="directionsscreen-title">
                <img src="Screens/screen9/Direções.png" alt="Direções">
            </div>

            <!-- Subtitle -->
            <div class="directionsscreen-subtitle">
                <img src="Screens/screen9/Desloque-se até ao Parque da Cidade Manuel Braga.png" alt="Desloque-se até ao Parque da Cidade Manuel Braga">
            </div>

            <!-- Map Image -->
            <div class="directionsscreen-map">
                <img src="Screens/screen9/image 3.png" alt="Mapa da localização">
            </div>

            <!-- Map Link -->
            <div class="directionsscreen-map-link">
                <a href="https://www.google.com/maps" target="_blank" class="directionsscreen-link">
                    <img src="Screens/screen9/Clique aqui para aceder às direções no Google Maps.png" alt="Clique aqui para aceder às direções no Google Maps">
                </a>
            </div>

            <!-- Address Info -->
            <div class="directionsscreen-address">
                <img src="Screens/screen9/Group 5.png" alt="Endereço do Parque da Cidade Manuel Braga">
            </div>
        </main>

        <!-- Footer with Button -->
        <footer class="app-footer">
            <a href="screen10.html">
                <button class="directionsscreen-button">
                    <img src="Screens/screen9/Group 2.png" alt="Cheguei!">
                </button>
            </a>
        </footer>
    </div>
</body>
</html>
