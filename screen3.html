<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guia - As nossas maravilhas de Coimbra</title>
    <link rel="stylesheet" href="components.css">
    <link rel="stylesheet" href="directions.css">
</head>
<body>
    <div class="route-container">
        <!-- Header with image -->
        <header class="app-header app-header--with-image">
            <img src="Screens/screen3/Guia.png" alt="Guia" class="app-header__title-image">
        </header>

        <!-- Main Content -->
        <main class="app-content app-content--scrollable">
            <!-- Directions Title -->
            <div class="directionsscreen-title">
                <img src="Screens/screen3/Direções.png" alt="Direções">
            </div>

            <!-- Subtitle -->
            <div class="directionsscreen-subtitle">
                <img src="Screens/screen3/Desloque-se até à escola Martim de Freitas.png" alt="Desloque-se até à escola Martim de Freitas">
            </div>

            <!-- Map Image -->
            <div class="directionsscreen-map">
                <img src="Screens/screen3/image 3.png" alt="Mapa da localização">
            </div>

            <!-- Map Link -->
            <div class="directionsscreen-map-link">
                <a href="#" class="directionsscreen-link">
                    <img src="Screens/screen3/Clique aqui para aceder às direções no Google Maps.png" alt="Clique aqui para aceder às direções no Google Maps">
                </a>
            </div>

            <!-- Address Info -->
            <div class="directionsscreen-address">
                <img src="Screens/screen3/Group 5.png" alt="R. André de Gouveia, Celas, Coimbra">
            </div>
        </main>

        <!-- Footer with Button -->
        <footer class="app-footer">
            <button class="directionsscreen-button">
                <img src="Screens/screen3/Group 2.png" alt="Cheguei!">
            </button>
        </footer>
    </div>
</body>
</html>
